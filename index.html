<style>

.ficha{display:grid;gap:10px}

.ficha .top>img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.scan{position:relative;width:92px;height:92px;border-radius:50%;overflow:hidden;flex:none}
.scan img{width:100%;height:100%;border-radius:50%}
.scan:after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--cy);box-shadow:0 0 12px var(--cy);animation:sc 1.2s ease-in-out infinite}

.row2{border-top:1px solid var(--line);padding-top:8px}

.tablet #ui{max-width:760px}
</style>

<script>

const SEED=`Juan Sebastián Morales

Sergio Martínez

const PROFILES=[
{k:'sergio serrano',aliases:['Serranovsky','El Hippie'],sa:['Serranovsky','Hippie'],origen:'Bogotano',rel:'Compañero de yagé del cumpleañero',fact:'Se aplicó veneno de rana para "fortalecer su sistema inmune". Sigue entre nosotros; la ciencia lo investiga.',dlabel:'Nivel de peligro',danger:null,quote:'Nadie sabe qué circula por ese torrente sanguíneo.',chismes:['Su aura es oficialmente la más agradable del grupo. Certificada por él mismo.','Debilidad confirmada: las góticas. Sin excepciones.','Se hizo amigo del cumpleañero tomando yagé. Pregúntale cómo fue… si te atreves.']},
{k:'santiago heredia',aliases:['Kakaioh','KKs','Santo','Herencio'],sa:['Kakaioh','KKs','Santo','Herencio'],origen:'Bogotano',rel:'Amigo de la universidad · 14 años de historia',fact:'Socio de la era youtuber: películas mentales huyendo de cámaras de seguridad.',dlabel:'Competitivo por naturaleza',danger:90,quote:'Perder no está en su vocabulario. Ni en su sistema digestivo.',chismes:['Creativo innato. Peligroso cuando se aburre.','Su momento más sólido como dúo: la era youtuber.','Tres jirafas y buenos amigos: ahí nacen las leyendas.']},
{k:'juan sebastian',aliases:['Morrales'],sa:['Morrales'],origen:'Bogotano',rel:'Sobrino del cumpleañero',fact:'DJ y "accionista minoritario" de Theatron. Casi tiene silla propia.',dlabel:'Días sin bañarse',danger:50,quote:'A mitad de escala: el sillón de al lado aún es seguro.',chismes:['En Theatron lo saludan por el nombre. Y por el saldo.','Es DJ: si hoy algo suena mal, ya hay un sospechoso.','Aprendió casi todo de su tío. Se nota. Para bien y para mal.']},
{k:'karen ortiz',aliases:['Mi amor','Preciosa'],sa:[],origen:'Cúcuta · N. de Santander',rel:'Novia del cumpleañero. Se conocieron el 18 de octubre.',fact:'Geóloga y científica de nacimiento. Inspiración de "La teoría de los dos cuerpos".',dlabel:'Pasos prohibidos',danger:100,quote:'Cuando ella baila, el reglamento deja de aplicar.',chismes:['Supremamente amorosa. Esa es la parte más peligrosa.','Estudia rocas y lleva semanas estudiando al cumpleañero. Resultados: prometedores.','Desde el 18 de octubre, geóloga oficial de este proyecto.']}];
function profileFor(name){const n=norm(name).split(' ');return PROFILES.find(p=>p.k.split(' ').every(t=>n.includes(t)))||{}}
function parseList(txt){return parseList0(txt).map(g=>Object.assign(g,{danger:null,fact:'Expediente en construcción',dlabel:'Nivel de peligro',chismes:[],origen:'',quote:''},profileFor(g.name)))}
function parseList0(txt){return txt.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const p=l.split('|').map(x=>x.trim());return{id:'g'+i+'_'+norm(p[0]).replace(/ /g,''),name:p[0],aliases:(p[1]||'').split(',').map(x=>x.trim()).filter(Boolean),rel:p[2]||'Invitado especial',fact:p[3]||'Información clasificada',danger:Math.max(0,Math.min(100,parseInt(p[4])||50)),photos:(p[5]||'').split(',').map(x=>x.trim()).filter(Boolean)}})}
let guests=parseList(S.list);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- coincidencia aproximada de nombres ----------
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const KB=(()=>{const rows=['qwertyuiop','asdfghjkl','zxcvbnm'],off=[0,.25,.75],m={};rows.forEach((r,y)=>[...r].forEach((c,x)=>m[c]=[x+off[y],y]));return m})();
function kcost(x,y){if(x===y)return 0;const p=KB[x],q=KB[y];return p&&q&&Math.hypot(p[0]-q[0],p[1]-q[1])<=1.3?.4:1}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){let v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+kcost(a[i-1],b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,d[i-2][j-2]+.5);d[i][j]=v}return d[m][n]}
function phon(t){return t.replace(/ph/g,'f').replace(/qu/g,'k').replace(/c(?=[ei])/g,'s').replace(/c/g,'k').replace(/z/g,'s').replace(/v/g,'b').replace(/ll/g,'y').replace(/h/g,'').replace(/w/g,'u').replace(/g(?=[ei])/g,'j').replace(/(.)\1+/g,'$1')}
function tokSim(a,b){return Math.max(tokSim0(a,b),tokSim0(phon(a),phon(b)))}
function tokSim0(a,b){if(a===b)return 1;if(b.startsWith(a)&&a.length>=3)return .9;return 1-lev(a,b)/Math.max(a.length,b.length)}
function score(input,cand){const it=norm(input).split(' ').filter(Boolean),ct=norm(cand).split(' ').filter(Boolean);if(!it.length||!ct.length)return 0;const pr=[];it.forEach((t,i)=>ct.forEach((c,j)=>pr.push([tokSim(t,c),i,j])));pr.sort((x,y)=>y[0]-x[0]);const ui_=new Set(),uj=new Set();let sum=0;for(const [v,i,j] of pr){if(v<.6||ui_.has(i)||uj.has(j))continue;ui_.add(i);uj.add(j);sum+=v}const avg=sum/it.length;const cover=Math.min(1,it.length/Math.min(ct.length,2));return avg*(.72+.28*cover)}
function findGuests(input){return guests.map(g=>({g,s:Math.max(score(input,g.name),...(g.sa||g.aliases).map(a=>score(input,a)))})).filter(x=>x.s>=.5).sort((a,b)=>b.s-a.s)}
function resolve(input){const r=findGuests(input);if(!r.length)return{type:'none'};if(r[0].s>=.85&&(!r[1]||r[0].s-r[1].s>=.12))return{type:'one',g:r[0].g,s:r[0].s};return{type:'pick',opts:r.slice(0,3).filter(x=>x.s>=r[0].s-.15).map(x=>x.g)}}

// ---------- red neuronal (canvas) ----------
const cv=document.getElementById('net'),ctx=cv.getContext('2d');
let pendingId=null,W=0,H=0,nodes=[],edges=[],pulses=[],traveler=null,imgs={},T=0;
const PHI=(1+Math.sqrt(5))/2,IV=[],IE=[];[[0,1,PHI],[0,-1,PHI],[0,1,-PHI],[0,-1,-PHI]].forEach(([a,b,c])=>IV.push([a,b,c],[b,c,a],[c,a,b]));
for(let i=0;i<12;i++)for(let j=i+1;j<12;j++){if(Math.abs(Math.hypot(IV[i][0]-IV[j][0],IV[i][1]-IV[j][1],IV[i][2]-IV[j][2])-2)<.01)IE.push([i,j])}
function drawCore(t){const cx=W/2,cy=H*.42,R=Math.min(W,H)*.2;
  ctx.save();ctx.translate(cx,cy);
  for(const [rr,sp] of [[1.55,.00008],[1.95,-.00005],[2.4,.00003]]){ctx.rotate(t*sp);ctx.strokeStyle='rgba(240,180,90,.10)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,R*rr,0,7);ctx.stroke();ctx.setLineDash([2,9]);ctx.strokeStyle='rgba(240,180,90,.24)';ctx.beginPath();ctx.arc(0,0,R*rr*1.06,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(240,180,90,.85)';ctx.beginPath();ctx.arc(R*rr,0,2.2,0,7);ctx.fill()}
  ctx.restore();
  for(const [sc,dir,al] of [[1,1,.30],[.55,-1.4,.20]]){const ay=core.ay*dir,ax=core.ax*dir,k=R*sc/1.902;
    const pts=IV.map(([x,y,z])=>{const y1=y*Math.cos(ax)-z*Math.sin(ax),z1=y*Math.sin(ax)+z*Math.cos(ax),x2=x*Math.cos(ay)+z1*Math.sin(ay),z2=-x*Math.sin(ay)+z1*Math.cos(ay),f=1/(1-z2*.07);return[cx+x2*k*f,cy+y1*k*f,z2]});
    ctx.shadowColor='#f0b45a';ctx.shadowBlur=8+core.fl*24;ctx.lineWidth=1;
    for(const [i,j] of IE){const d=(pts[i][2]+pts[j][2])/2;ctx.strokeStyle='rgba(240,180,90,'+(al*(.55+d*.2)+core.fl*.35)+')';ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[j][0],pts[j][1]);ctx.stroke()}
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,236,200,'+(al*2.2)+')';for(const q of pts){ctx.beginPath();ctx.arc(q[0],q[1],1.6,0,7);ctx.fill()}}
  ctx.fillStyle='rgba(240,180,90,.28)';for(let y=0;y<H;y+=24){const L=y%120===0?12:4;ctx.fillRect(0,y,L,1);ctx.fillRect(W-L,y,L,1)}
  const sw=(t*.05)%(H+200)-100;const g=ctx.createLinearGradient(0,sw-60,0,sw);g.addColorStop(0,'rgba(240,180,90,0)');g.addColorStop(1,'rgba(240,180,90,.035)');ctx.fillStyle=g;ctx.fillRect(0,sw-60,W,60);
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
const core={ay:0,ax:0,vy:0,vx:0,fl:0,last:0};
let drag=null;const CR=()=>Math.min(W,H)*.2;
function stepCore(t){const dt=Math.min(50,t-(core.last||t));core.last=t;
  if(drag){const h=Math.exp(-dt/120);core.vy*=h;core.vx*=h}
  else{core.ay+=(.00025+core.vy)*dt;core.ax+=(.00017+core.vx)*dt;const f=Math.exp(-dt/900);core.vy*=f;core.vx*=f}

function chismesHTML(g){if(!g.chismes||!g.chismes.length)return'';return `<div class="row2"><small>Chismes · toca para desclasificar</small>${g.chismes.map(c=>`<button class="ch"><span class="lock">▒▒▒▒ CLASIFICADO ▒▒▒▒</span><span class="tx">${esc(c)}</span></button>`).join('')}<p class="chdone" style="display:none">Archivo completo. Ahora ve y pregúntaselo en persona.</p></div>`}
function fichaInner(g,selfie,o){
  const head=`<div class="top">${o.scanning?`<div class="scan"><img src="${selfie}" alt=""></div>`:`<img src="${selfie}" alt="">`}<div><h1 style="margin:0">${esc(g.name)}</h1><div class="chips">${g.aliases.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}${g.origen?`<span class="chip">${esc(g.origen)}</span>`:''}</div><div class="mono" id="mono">${o.scanning?'':'> Identidad verificada'}</div></div></div>`;
  if(o.scanning)return head;
  return head+`<div class="row2"><small>Relación con el cumpleañero</small><span>${esc(g.rel)}</span></div><div class="row2"><small>Dato clasificado</small><span>${esc(g.fact)}</span></div>${meterHTML(g)}${chismesHTML(g)}${gallery(g)}${o.surprise?`<p style="margin:6px 0 0">${o.retract?'Dijiste que no venías… y aquí estás. Expediente actualizado.':'Aparece en la lista, pero no había confirmado antes. ¡Invitado sorpresa!'}</p>`:''}`}
function mountFicha(el,g,selfie,o){el.innerHTML=fichaInner(g,selfie,o)+(o.extra||'');
  el.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{b.classList.toggle('open');const all=[...el.querySelectorAll('.ch')],d=el.querySelector('.chdone');if(d)d.style.display=all.every(x=>x.classList.contains('open'))?'block':'none'});
  setTimeout(()=>el.querySelectorAll('.dg').forEach(b=>b.style.width=b.dataset.v+'%'),120);
  el.querySelectorAll('.ph').forEach((f,i)=>setTimeout(()=>f.classList.add('in'),900+i*700))}
function renderFicha(){const{g,selfie,stage,surprise,retract}=step,cur=(S.reg[g.id]||{}).plus||0;
  shell(`<div class="card ficha" id="fc"></div>`);const fc=document.getElementById('fc');
  const extra=stage?`<div class="row2"><small>Acompañantes · máximo 3</small><div class="plus">${[0,1,2,3].map(n=>`<button class="pl${n===cur?' on':''}" data-n="${n}">${n}</button>`).join('')}</div><p class="note">No necesitan registrarse: solo dinos cuántos vienen contigo.</p></div><button class="btn" id="next">${step.confirm?'Listo':'Siguiente invitado'}</button>`:'';
  mountFicha(fc,g,selfie,{scanning:!stage,surprise,retract,extra});
  const n=document.getElementById('next');if(n)n.onclick=()=>{step={n:'name'};render()};
  fc.querySelectorAll('.pl').forEach(b=>b.onclick=()=>{const rg=S.reg[g.id]=S.reg[g.id]||{};rg.plus=+b.dataset.n;save();fc.querySelectorAll('.pl').forEach(x=>x.classList.toggle('on',x===b))});
  if(stage)music('x')}
function openProfile(id){const g=guests.find(x=>x.id===id),rg=S.reg[id];if(!g||!rg||!rg.selfie)return;
  let m=document.getElementById('prof');if(!m){m=document.createElement('div');m.id='prof';document.body.appendChild(m)}
  m.innerHTML='<div class="card ficha" id="pcard"></div>';m.classList.add('on');
  mountFicha(document.getElementById('pcard'),g,rg.selfie,{extra:'<button class="btn ghost" id="pcl">Cerrar</button>'});
  document.getElementById('pcl').onclick=()=>m.classList.remove('on');m.onclick=e=>{if(e.target===m)m.classList.remove('on')}}
function statusCard(){const L=f=>guests.filter(g=>f(S.reg[g.id]||{})).map(g=>esc(g.name)).join(', ')||'—';return `<div class="card"><h2>Estado</h2><div class="row2"><small>Confirmados</small><span>${L(r=>r.confirmedAt)}</span></div><div class="row2"><small>No asisten</small><span>${L(r=>r.declinedAt)}</span></div><div class="row2"><small>Acompañantes</small><span>${guests.filter(g=>(S.reg[g.id]||{}).plus>0).map(g=>esc(g.name.split(' ')[0])+' +'+S.reg[g.id].plus).join(', ')||'—'}</span></div><div class="row2"><small>Sin respuesta</small><span>${L(r=>!r.confirmedAt&&!r.declinedAt)}</span></div></div>`}
function renderList(){shell(`<div class="card"><h2>Lista de invitados</h2><p>Una línea por persona:<br><b>Nombre completo | apodos, separados, por coma | parentesco | dato curioso | peligro 0-100 | fotos (rutas, separadas por coma)</b></p><textarea id="ta">${esc(S.list)}</textarea><button class="btn" id="sv">Guardar lista</button><button class="btn ghost" id="rs">Borrar registros de prueba</button><div id="msg"></div></div>${statusCard()}`);
  document.getElementById('sv').onclick=()=>{S.list=document.getElementById('ta').value;guests=parseList(S.list);save();rebuild();document.getElementById('msg').innerHTML='<p style="margin-top:12px">Lista guardada: '+guests.length+' invitados.</p>'};
  document.getElementById('rs').onclick=()=>{if(cloud){document.getElementById('msg').innerHTML='<p style="margin-top:12px">Los registros viven en Firebase. Para borrarlos: consola de Firebase → Firestore → colección reg.</p>';return}S.reg={};save();rebuild();render()}}

const EVENT=new Date(2026,10,28,0,0,0);
function updateCD(){const el=document.getElementById('cd');if(!el)return;const ms=EVENT-Date.now();
  if(ms<=0){el.innerHTML=Date.now()<EVENT.getTime()+864e5?'<div class="cdmsg">HOY ES EL DÍA · PROYECTO X EN CURSO</div>':'<div class="cdmsg">MISIÓN CUMPLIDA</div>';return}
  const t=Math.floor(ms/1000),q=n=>String(n).padStart(2,'0'),u=[[Math.floor(t/86400),'DÍAS'],[Math.floor(t%86400/3600),'HRS'],[Math.floor(t%3600/60),'MIN'],[t%60,'SEG']];
  el.innerHTML=u.map(x=>`<div><b>${q(x[0])}</b><small>${x[1]}</small></div>`).join('<i>:</i>')}
const AU={x:new Audio('musica/track.mp3')},VOL={x:.8};
Object.values(AU).forEach(a=>{a.loop=true;a.volume=0;a.preload='auto';a.onerror=()=>{}});
let want='x',muted=false,started=false;
function music(k){want=k}
addEventListener('pointerdown',()=>{started=true;for(const k in AU){AU[k].play().then(()=>{if(k!==want)AU[k].pause()}).catch(()=>{})}},{once:true});
document.getElementById('snd').onclick=e=>{muted=!muted;e.target.textContent=muted?'♪ OFF':'♪ ON'};
setInterval(()=>{for(const k in AU){const a=AU[k],tgt=(!started||muted||k!==want)?0:VOL[k];if(tgt>0&&a.paused)a.play().catch(()=>{});const v=a.volume,nv=v<tgt?Math.min(tgt,v+.02):Math.max(tgt,v-.02);if(nv!==v)a.volume=nv;if(nv===0&&!a.paused&&(muted||k!==want))a.pause()}},60);
// ---------- nube (Firebase): las confirmaciones se guardan y se ven en todos los dispositivos
const FB={apiKey:"AIzaSyBZPh0vWGi5wd85xC3eOLXykHBtQQDec7Q",authDomain:"xproject-61af2.firebaseapp.com",projectId:"xproject-61af2",storageBucket:"xproject-61af2.firebasestorage.app",messagingSenderId:"230354675245",appId:"1:230354675245:web:61dd4de7416dc093187aa4"};
function syncOut(){if(!cloud)return;for(const id in S.reg){const j=JSON.stringify(S.reg[id]);if(lastSent[id]===j)continue;lastSent[id]=j;cloud.doc(id).set(JSON.parse(j),{merge:true}).catch(()=>{delete lastSent[id]})}}
function refreshStats(){const el=document.querySelector('.stats');if(el){const t=document.createElement('div');t.innerHTML=stats();el.replaceWith(t.firstElementChild)}}
function startCloud(){if(typeof firebase==='undefined')return;
  try{firebase.initializeApp(FB);
    firebase.auth().signInAnonymously().then(()=>{const col=firebase.firestore().collection('reg');
      col.onSnapshot(snap=>{snap.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){delete S.reg[id];delete lastSent[id]}else{S.reg[id]=ch.doc.data();lastSent[id]=JSON.stringify(S.reg[id])}});
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(traveler)deferRebuild=true;else rebuild();refreshStats()},()=>{cloud=null});
      cloud=col;syncOut()}).catch(()=>{cloud=null})}catch(e){cloud=null}}
startCloud();
setInterval(()=>{const d=new Date(),q=n=>String(n).padStart(2,'0');document.getElementById('clk').textContent=q(d.getHours())+':'+q(d.getMinutes())+':'+q(d.getSeconds());document.getElementById('hl').textContent='PROYECTO X · '+(cloud?'EN LÍNEA':'LOCAL');document.getElementById('cnt').textContent='NODOS '+Object.values(S.reg).filter(r=>r.confirmedAt).length+'/'+guests.length;updateCD()},500);
rebuild();render();requestAnimationFrame(frame);
</script>
