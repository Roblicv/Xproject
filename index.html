const CUBE={a:45,b:61,c:75};

      col.onSnapshot(snap=>{snap.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){delete S.reg[id];delete lastSent[id]}else{S.reg[id]=ch.doc.data();lastSent[id]=JSON.stringify(S.reg[id])}});
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(traveler)deferRebuild=true;else rebuild();refreshStats()},()=>{cloud=null});
      cloud=col;syncOut();subMsgs(fsd)}).catch(()=>{cloud=null})}catch(e){cloud=null}}
startCloud();
setInterval(()=>{const d=new Date(),q=n=>String(n).padStart(2,'0');document.getElementById('clk').textContent=q(d.getHours())+':'+q(d.getMinutes())+':'+q(d.getSeconds());document.getElementById('hl').textContent=cloud?'● EN LÍNEA':'○ LOCAL';document.getElementById('cnt').textContent='NODOS '+Object.values(S.reg).filter(r=>r.confirmedAt||r.arrivedAt).length+'/'+guests.length;updateCD()},500);
rebuild();render();requestAnimationFrame(frame);
</script>
</body>
